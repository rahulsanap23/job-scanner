# Target companies and where their jobs come from.
#
# Every company here is scanned daily by scanner/run.py. `sources` lists the
# careers platforms to read (tried in order; a source marked `fallback: true`
# only runs when the ones before it fail or return nothing). A company with no
# sources is shown on the board as "not scanned automatically" with a link to
# its careers page, so nothing is silently skipped.
#
# To add a company, copy an entry with the same platform and change the ids.
# Platform ids come from the company's careers URL, e.g.
#   https://citi.wd5.myworkdayjobs.com/2         -> workday host citi.wd5.myworkdayjobs.com, site "2"
#   https://job-boards.greenhouse.io/databricks  -> greenhouse token databricks
#   https://jobs.lever.co/cred                   -> lever site cred
#   https://jobs.ashbyhq.com/snowflake           -> ashby org snowflake
#   https://jobs.smartrecruiters.com/Ubisoft2    -> smartrecruiters company_id Ubisoft2

