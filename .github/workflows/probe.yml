name: probe-endpoints

# Maintenance helper: checks careers endpoints listed in probe/targets.json.
# Runs when that file changes on the "probe" branch, or manually.
# (Temporary: applies probe/config.patch to careers-feeds-2 and runs the tests.)
on:
  push:
    branches: [probe]
    paths: ["probe/targets.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply config patch to careers-feeds-2
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/res
          cp probe/config.patch /tmp/config.patch
          git checkout -q -b cf origin/careers-feeds-2
          git apply /tmp/config.patch
          git add config/companies.yaml
          git commit -q -m "config: keep Atlas Copco on LinkedIn" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_017KkaAYsDqiCZ28PwRQhbtn"
          git push origin HEAD:careers-feeds-2
          pip install -q -r requirements.txt pytest
          python -m pytest -q tests > /tmp/res/pytest.txt 2>&1 || true
          python -c "import yaml;from scanner.adapters import ADAPTERS;c=yaml.safe_load(open('config/companies.yaml'))['companies'];print(len(c),[x['name'] for x in c if any(s['type'] not in ADAPTERS for s in x.get('sources') or [])])" > /tmp/res/config_check.txt 2>&1 || true
          git checkout -q -f probe
          mkdir -p probe/out
          cp /tmp/res/* probe/out/
      - name: Commit results
        run: |
          git add probe/out
          git commit -q -m "probe results [skip ci]" || exit 0
          git push origin HEAD:probe
