name: probe-endpoints

# Maintenance helper: checks careers endpoints listed in probe/targets.json.
# Runs when that file changes on the "probe" branch, or manually.
on:
  push:
    branches: [probe]
    paths: ["probe/targets.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe/probe.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add probe/results.json probe/out || true
          git commit -q -m "probe results [skip ci]" || exit 0
          if ! out=$(git push 2>&1); then
            echo "::warning title=push failed, retrying without page copies::$(echo "$out" | tr '\n' ' ' | cut -c1-600)"
            git reset -q --soft HEAD~1 && git reset -q
            rm -rf probe/out
            python -c "import json;p='probe/results.json';r=json.load(open(p));[x.pop('snippet',None) for x in r];json.dump(r,open(p,'w'),indent=1)"
            git add probe/results.json && git commit -q -m "probe results (no page copies) [skip ci]"
            git push
          fi
