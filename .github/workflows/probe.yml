name: probe-endpoints

# Maintenance helper: checks careers endpoints listed in probe/targets.json.
# Runs when that file changes on the "probe" branch, or manually.
# (Temporary: applies probe/config.patch to the careers-feeds branch.)
on:
  push:
    branches: [probe]
    paths: ["probe/targets.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply config patch to careers-feeds
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          cp probe/config.patch /tmp/config.patch
          git checkout -q -b cf origin/careers-feeds
          git apply /tmp/config.patch
          git add config/companies.yaml
          git commit -q -m "config: keep Atlas Copco on LinkedIn" \
            -m "Its SuccessFactors Unify search leaves most jobs' location out, so India roles can't be picked out." \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_017KkaAYsDqiCZ28PwRQhbtn"
          git push origin HEAD:careers-feeds
