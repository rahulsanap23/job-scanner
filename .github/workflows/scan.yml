name: daily-job-scan

on:
  schedule:                 # GitHub cron is UTC; it can start scheduled runs late, so each run has a retry
    - cron: "30 0 * * *"    # 6:00 AM IST
    - cron: "30 1 * * *"    # 7:00 AM IST retry (skips itself if the 6 AM scan finished)
    - cron: "30 9 * * *"    # 3:00 PM IST
    - cron: "0 10 * * *"    # 3:30 PM IST retry (skips itself if the 3 PM scan finished)
  workflow_dispatch:         # "Run workflow" button for manual runs
  push:
    branches: [dev]          # test runs while changing the scanner
    paths: ["scanner/**", "config/**", "board/template.html", ".github/workflows/scan.yml"]

permissions:
  contents: write            # lets the job commit data/ and board/ back to the repo

concurrency:
  group: daily-job-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Skip a retry if the scan it backs up already finished
        id: check
        run: |
          skip=false
          case "${{ github.event.schedule }}" in
            "30 1 * * *"|"0 10 * * *")
              last=$(python3 -c "import json;print(json.load(open('data/jobs.json'))['meta']['generated_at'])" 2>/dev/null || echo "")
              if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 6000 ]; then
                skip=true   # a scan finished in the last 100 minutes
              fi;;
          esac
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Scan careers sites
        if: steps.check.outputs.skip != 'true'
        run: python -m scanner.run

      - name: Fetch job descriptions (new roles only)
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true   # a description problem must never block the scan
        timeout-minutes: 10
        run: python -m scanner.descriptions

      - name: Build board page
        if: steps.check.outputs.skip != 'true'
        run: python -m scanner.board

      - name: Commit results
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Start from the latest branch head and lay this scan's outputs on top. Only this
          # workflow writes them; data/linkedin_cache.json is also written by linkedin-refresh,
          # so it is merged company by company (newest wins) instead of overwritten.
          mkdir -p /tmp/out && cp -r data /tmp/out/ && cp board/index.html /tmp/out/index.html
          for attempt in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            for f in /tmp/out/data/*; do
              [ "$(basename "$f")" = linkedin_cache.json ] || cp "$f" data/
            done
            cp /tmp/out/index.html board/index.html
            python -m scanner.linkedin_refresh --merge /tmp/out/data/linkedin_cache.json
            git add data board/index.html
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "scan $(TZ=Asia/Kolkata date +%F)"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "push failed (attempt $attempt); retrying"; sleep 10
          done
          exit 1
