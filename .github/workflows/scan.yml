name: daily-job-scan

on:
  schedule:
    - cron: "17 0 * * *"    # 00:17 UTC = 5:47 AM IST, every day
    - cron: "17 2 * * *"    # 7:47 AM IST retry; skips itself if today's scan already succeeded
  workflow_dispatch:         # "Run workflow" button for manual runs
  push:
    branches: [dev]          # test runs while changing the scanner
    paths: ["scanner/**", "config/**", "board/template.html", ".github/workflows/scan.yml"]

permissions:
  contents: write            # lets the job commit data/ and board/ back to the repo

concurrency:
  group: daily-job-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Skip the retry if today's scan already succeeded
        id: check
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          skip=false
          if [ "${{ github.event.schedule }}" = "17 2 * * *" ] && grep -q "\"date\": \"$today\"" data/jobs.json 2>/dev/null; then
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Scan careers sites
        if: steps.check.outputs.skip != 'true'
        run: python -m scanner.run

      - name: Build board page
        if: steps.check.outputs.skip != 'true'
        run: python -m scanner.board

      - name: Commit results
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data board/index.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "scan $(TZ=Asia/Kolkata date +%F)"
            git pull --rebase --autostash
            git push
          fi
