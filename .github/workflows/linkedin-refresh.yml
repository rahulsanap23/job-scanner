name: linkedin-refresh

# Checks LinkedIn for a few companies at a time between the daily scans (see
# scanner/linkedin_refresh.py): companies whose careers site gave nothing (about twice a day
# each), a cross-check of every other company (at least a third of each run's searches), and a
# general remote-India search twice a day. Each run gets a fresh GitHub runner, so small
# batches rarely hit LinkedIn's rate limit. Writes data/linkedin_cache.json, which the next
# daily scan reads, and data/descriptions.json (descriptions for a few roles whose careers
# site didn't give one, looked up on LinkedIn by company and title).
on:
  schedule:                 # every hour (22 runs a day), clear of the scans at 00:30-01:30 and 09:30-10:00 UTC
    - cron: "15 2-8,11-23 * * *"   # 7:45 AM to 1:45 PM and 4:45 PM to 4:45 AM IST
    - cron: "45 1,10 * * *"        # 7:15 AM and 4:15 PM IST, after the scans
  workflow_dispatch:
    inputs:
      batch:
        description: "companies to search"
        default: "8"

permissions:
  contents: write

concurrency:
  group: linkedin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Search LinkedIn for the next batch
        run: python -m scanner.linkedin_refresh --batch "${{ github.event.inputs.batch || '8' }}"

      - name: Commit the cache and descriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/linkedin_cache.json /tmp/linkedin_cache.json
          cp data/descriptions.json /tmp/descriptions.json 2>/dev/null || echo "{}" > /tmp/descriptions.json
          for attempt in 1 2 3; do
            # start from the latest main and merge our results in (cache: company by company, newest
            # wins; descriptions: role by role, a found description wins), so a scan or another
            # refresh that pushed meanwhile is never overwritten
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            python -m scanner.linkedin_refresh --merge /tmp/linkedin_cache.json
            python -m scanner.descriptions --merge /tmp/descriptions.json
            git add data/linkedin_cache.json data/descriptions.json
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "linkedin refresh $(TZ=Asia/Kolkata date '+%F %H:%M')"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "push failed (attempt $attempt); retrying"; sleep 10
          done
          exit 1
